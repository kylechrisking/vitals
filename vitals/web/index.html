<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Status</title>
<link rel="icon" id="favicon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%2394a3b8'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0b0f19; --surface: #121829; --surface-2: #1a2236; --border: #ffffff14; --text: #e7eaf3; --muted: #8690a8;
  --accent: #818cf8; --ok: #34d399; --warn: #fbbf24; --bad: #fb7185; --none: #2a3349; --maint: #818cf8;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f4f6fb; --surface: #ffffff; --surface-2: #eef1f7; --border: #0f172a14; --text: #111827; --muted: #5b6478;
          --accent: #4f46e5; --ok: #059669; --warn: #d97706; --bad: #e11d48; --none: #dde2ec; --maint: #6366f1; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
.page { max-width: 1040px; margin: 0 auto; padding: 24px 16px 48px; }
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px; }
h1 { margin: 0; font-size: 22px; letter-spacing: -0.01em; }
nav { display: flex; gap: 4px; }
nav a { color: var(--muted); text-decoration: none; font-size: 14px; padding: 6px 10px; border-radius: 8px; }
nav a[aria-current="page"] { color: var(--text); background: var(--surface); }
.spacer { flex: 1; }
.muted { color: var(--muted); font-size: 13px; }
.banner { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-radius: 14px; background: var(--surface);
          border: 1px solid var(--border); font-weight: 600; margin-bottom: 14px; }
.banner.down { border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
.tile .k { font-size: 11.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
.tile .v { font-size: 22px; font-weight: 700; margin-top: 2px; }
.tile .v small { font-size: 14px; color: var(--muted); font-weight: 500; }
.tile.bad .v { color: var(--bad); }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 22px 0 8px 2px; display: flex; gap: 8px; align-items: center; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 13px 15px; min-width: 0; }
.card.down { border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.card.warn { border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
.card-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.card-head b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-head .right { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.card .line { font-size: 12.5px; color: var(--muted); margin-top: 6px; overflow-wrap: anywhere; }
.card .line.bad { color: var(--bad); } .card .line.warn { color: var(--warn); }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.up { background: var(--ok); } .dot.down { background: var(--bad); } .dot.maintenance { background: var(--maint); }
.rows { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
.row { padding: 10px 14px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 14px; border-top: 1px solid var(--border); align-items: center; }
.row:first-child { border-top: 0; }
.row .name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row .name b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .right { display: flex; gap: 12px; align-items: center; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: nowrap; }
.row .detail { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); font-family: var(--mono); overflow-wrap: anywhere; padding-left: 19px; }
.row.down .detail { color: var(--bad); }
.bars { display: grid; grid-template-columns: repeat(30, 6px); gap: 2px; height: 16px; }
.bars i { border-radius: 2px; background: var(--none); }
.bars i.ok { background: var(--ok); } .bars i.warn { background: var(--warn); } .bars i.bad { background: var(--bad); }
.ack { font: inherit; font-size: 11.5px; padding: 2px 8px; border-radius: 7px; cursor: pointer;
       border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
.acked { font-size: 11.5px; color: var(--muted); }
.filter { font: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--border);
          border-radius: 9px; padding: 7px 11px; width: min(280px, 100%); }
.incidents { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px 16px; }
.incident { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border); font-size: 14px; flex-wrap: wrap; }
.incident:first-child { border-top: 0; }
.incident .when { color: var(--muted); font-family: var(--mono); font-size: 12.5px; min-width: 120px; }
.incident .open { color: var(--bad); font-weight: 600; }
.empty { color: var(--muted); padding: 12px 0; font-size: 14px; }
.errors { border: 1px solid color-mix(in srgb, var(--warn) 50%, transparent); color: var(--warn); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 13px; }
footer { margin-top: 28px; text-align: center; }
@media (max-width: 700px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .right { justify-content: space-between; }
  .bars { grid-template-columns: repeat(14, 6px); } .bars i:nth-child(-n+16) { display: none; }
  .row .right .lat { display: none; }
  .incident { flex-direction: column; gap: 2px; } .incident .when { min-width: 0; }
}
</style>
</head>
<body>
<div class="page">
  <header>
    <h1 id="title">Status</h1>
    <nav id="nav" hidden><a href="./" aria-current="page">Status</a><a href="settings">Settings</a></nav>
    <span class="spacer"></span>
    <span id="updated" class="muted"></span>
  </header>
  <div id="errors" class="errors" hidden></div>
  <div id="banner" class="banner"><span class="dot"></span><span>Loading…</span></div>
  <div id="tiles" class="tiles"></div>
  <div id="sites-block" hidden><h2>Sites</h2><div id="sites" class="cards"></div></div>
  <div id="hosts-block" hidden><h2>Hosts</h2><div id="hosts" class="cards"></div></div>
  <div id="checks-block" hidden>
    <h2>Checks <span class="spacer"></span><input id="filter" class="filter" type="search" placeholder="Filter" aria-label="Filter checks"></h2>
    <div id="groups"></div>
  </div>
  <h2>Recent incidents</h2>
  <div id="incidents" class="incidents"></div>
  <footer class="muted">Vitals</footer>
</div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = (v) => (v == null ? "–" : `${v >= 99.995 ? "100" : v.toFixed(v >= 99.9 ? 2 : 1)}%`);
function dur(s) {
  s = Math.max(0, Math.round(s));
  if (s < 60) return `${s}s`;
  if (s < 3600) return `${Math.floor(s / 60)}m`;
  if (s < 86400) return `${Math.floor(s / 3600)}h ${Math.floor((s % 3600) / 60)}m`;
  return `${Math.floor(s / 86400)}d ${Math.floor((s % 86400) / 3600)}h`;
}
const when = (t) => new Date(t * 1000).toLocaleString([], { month: "short", day: "numeric", hour: "2-digit", minute: "2-digit" });
const barTone = (v) => (v == null ? "" : v >= 99.5 ? "ok" : v >= 95 ? "warn" : "bad");
let data = null, query = "";

function statusWord(c, now) {
  return c.status === "maintenance" ? "maintenance" : c.status === "pending" ? (c.type === "push" ? "waiting for first check-in" : "checking…")
    : c.status === "down" ? `down ${dur(now - c.since)}` : "up";
}
function bars(c) {
  return `<div class="bars" aria-label="Daily uptime, last 30 days">${(c.bars || []).map((v, i) =>
    `<i class="${barTone(v)}" title="${v == null ? "no data" : pct(v)} · ${i === c.bars.length - 1 ? "today" : `${c.bars.length - 1 - i}d ago`}"></i>`).join("")}</div>`;
}
// Acknowledge: stops "still down" reminders for this outage (signed-in page only).
function ackButton(c) {
  if (c.status !== "down" || !data.full) return "";
  return c.acked ? `<span class="acked">acknowledged</span>` : `<button class="ack" data-ack="${esc(c.id)}">Acknowledge</button>`;
}
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-ack]");
  if (!b) return;
  b.disabled = true;
  await fetch("api/ack", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: b.dataset.ack }) });
  load(true);
});

function row(c, now) {
  return `<div class="row ${esc(c.status)}">
    <div class="name"><span class="dot ${esc(c.status)}"></span><b title="${esc(c.target || c.name)}">${esc(c.name)}</b></div>
    <div class="right"><span class="lat">${c.latency_ms != null && c.status === "up" ? `${c.latency_ms} ms` : ""}</span>
      <span title="7d ${pct(c.uptime["7d"])} · 30d ${pct(c.uptime["30d"])} · 90d ${pct(c.uptime["90d"])}">${pct(c.uptime["30d"])}</span>
      ${bars(c)}<span>${esc(statusWord(c, now))}</span>${ackButton(c)}</div>
    ${c.status === "down" && c.detail ? `<div class="detail">${esc(c.detail)}</div>` : ""}
  </div>`;
}

function render() {
  const d = data, now = d.generated_at;
  document.title = d.title;
  $("#title").textContent = d.title;
  $("#nav").hidden = !d.full;
  $("#updated").textContent = `Updated ${new Date(now * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}${d.quiet ? " · quiet hours" : ""}`;
  $("#errors").hidden = !(d.errors || []).length;
  $("#errors").textContent = (d.errors || []).join(" · ");

  const sites = d.checks.filter((c) => c.source === "site");
  const hostRows = d.checks.filter((c) => c.source === "agent" && c.id.endsWith("/host"));
  const problems = {};
  for (const c of d.checks.filter((c) => c.source === "agent" && !c.id.endsWith("/host"))) {
    const host = c.id.slice(6).split("/")[0];
    (problems[host] ||= []).push(c);
  }
  const rest = d.checks.filter((c) => c.source !== "site" && c.source !== "agent");

  // The headline: sites if there are any (that's what "is everything OK" means), else everything.
  const watched = sites.length ? sites : d.checks;
  const down = watched.filter((c) => c.status === "down");
  const othersDown = d.checks.filter((c) => c.status === "down" && !watched.includes(c));
  $("#banner").className = `banner ${down.length ? "down" : ""}`;
  $("#banner").innerHTML = `<span class="dot ${down.length ? "down" : d.checks.length ? "up" : ""}"></span><span>${
    !d.checks.length ? "Nothing is being watched yet. Open Settings to add checks, sites and hosts."
    : down.length ? `${esc(down.map((c) => c.name).join(", "))} ${down.length === 1 ? "is" : "are"} down`
    : sites.length ? `All ${sites.length === 1 ? "sites" : `${sites.length} sites`} up${othersDown.length ? ` · ${othersDown.length} other ${othersDown.length === 1 ? "problem" : "problems"}` : ""}`
    : "Everything is up"}</span>`;
  const fav = down.length ? "%23ef4444" : d.checks.length ? "%2322c55e" : "%2394a3b8";
  $("#favicon").href = `data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='${fav}'/%3E%3C/svg%3E`;

  const count = (list) => [list.filter((c) => c.status === "up").length, list.length];
  const open = d.incidents.filter((i) => !i.end).length;
  const tiles = [];
  if (sites.length) tiles.push(["Sites up", ...count(sites)]);
  if (hostRows.length) tiles.push(["Hosts reporting", ...count(hostRows)]);
  tiles.push(["Checks up", ...count(rest)]);
  tiles.push(["Open incidents", open, null]);
  $("#tiles").style.gridTemplateColumns = innerWidth > 700 ? `repeat(${tiles.length}, minmax(0, 1fr))` : "";
  $("#tiles").innerHTML = tiles.map(([k, a, b]) =>
    `<div class="tile ${(b != null && a < b) || (b == null && a) ? "bad" : ""}"><div class="k">${k}</div><div class="v">${a}${b != null ? `<small> / ${b}</small>` : ""}</div></div>`).join("");

  $("#sites-block").hidden = !sites.length;
  $("#sites").innerHTML = sites.map((c) => `<div class="card ${c.status === "down" ? "down" : ""}">
      <div class="card-head"><span class="dot ${esc(c.status)}"></span><b>${esc(c.name)}</b><span class="right">${pct(c.uptime["30d"])}</span></div>
      <div class="line ${c.status === "down" ? "bad" : ""}">${esc(c.status === "down" ? `${statusWord(c, now)} · ${c.detail || ""}` : c.detail || statusWord(c, now))}</div>
    </div>`).join("");

  $("#hosts-block").hidden = !hostRows.length;
  $("#hosts").innerHTML = hostRows.map((c) => {
    const host = c.id.slice(6).split("/")[0];
    const bad = (problems[host] || []).filter((p) => p.status === "down");
    const tone = c.status === "down" ? "down" : bad.length ? "warn" : "";
    return `<div class="card ${tone}">
      <div class="card-head"><span class="dot ${esc(c.status)}"></span><b>${esc(c.name)}</b><span class="right">${esc(statusWord(c, now))}</span></div>
      <div class="line">${esc(c.status === "down" ? c.detail || "" : c.summary || "")}</div>
      ${bad.map((p) => `<div class="line warn">${esc(p.name.split("·").pop().trim())}: ${esc(p.detail || "")}</div>`).join("")}
    </div>`;
  }).join("");

  const shown = rest.filter((c) => !query || `${c.name} ${c.group} ${c.target || ""}`.toLowerCase().includes(query));
  $("#checks-block").hidden = !rest.length;
  const groups = new Map();
  for (const c of [...shown].sort((a, b) => (b.status === "down") - (a.status === "down") || a.name.localeCompare(b.name))) {
    const g = c.group || "Checks";
    if (!groups.has(g)) groups.set(g, []);
    groups.get(g).push(c);
  }
  $("#groups").innerHTML = shown.length ? [...groups].sort(([a], [b]) => a.localeCompare(b)).map(([g, cs]) =>
    `<h2 style="margin-top:14px">${esc(g)}</h2><div class="rows">${cs.map((c) => row(c, now)).join("")}</div>`).join("")
    : `<div class="empty">Nothing matches “${esc(query)}”.</div>`;

  const word = (i) => i.about === "host" ? ["stopped reporting for", "isn't reporting"]
    : i.about === "problem" ? ["had a problem for", "has a problem"] : ["was down for", "is down"];
  $("#incidents").innerHTML = d.incidents.length ? d.incidents.slice(0, 20).map((i) => {
    const [past, now_] = word(i);
    return `<div class="incident"><span class="when">${when(i.start)}</span><span><b>${esc(i.check)}</b> ${
      i.end ? `${past} ${dur(i.end - i.start)}` : `<span class="open">${now_}</span> (${dur(now - i.start)})`}${
      i.maintenance ? " · during maintenance" : ""}${i.detail ? ` · <span class="muted">${esc(i.detail)}</span>` : ""}</span></div>`;
  }).join("") : `<div class="empty">No incidents recorded.</div>`;
}

$("#filter").addEventListener("input", (e) => { query = e.target.value.trim().toLowerCase(); if (data) render(); });
addEventListener("resize", () => data && render());

async function load(once = false) {
  try {
    const r = await fetch("api/status", { cache: "no-store" });
    if (r.ok) { data = await r.json(); render(); }
    else $("#banner").innerHTML = `<span class="dot down"></span><span>This page needs a token: open it as ?token=…</span>`;
  } catch {
    $("#updated").textContent = "Can't reach Vitals — retrying";
  }
  if (!once) setTimeout(load, 15000);
}
load();
</script>
</body>
</html>
